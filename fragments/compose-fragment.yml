services:
  admin-ui:
    container_name: admin-ui
    build:
      context: ./admin-ui
      dockerfile: Dockerfile.dev
    restart: on-failure
    ports:
      - "127.0.0.1:9083:5000"
    environment:
      AUTH_API_INTERNAL_URL: http://auth-api:8000
      CLUSTERKEEP_UI_URL: http://localhost:9080
      STORAGE_UI_URL: http://localhost:9081
      HEADLAMP_URL: https://headlamp.clusterkeep.dev.net
    depends_on:
      - auth-api
    volumes:
      - ./admin-ui/app.py:/app/app.py:ro
      - ./admin-ui/templates:/app/templates:ro
      - ./admin-ui/static:/app/static:ro
      - ./admin-ui/tests:/app/tests:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
